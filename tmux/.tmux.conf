# --- terminal ---
set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',*:UTF-8'

# --- plugins (declared BEFORE tpm init at the bottom) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- dracula ---
set -g @dracula-plugins "battery network"
set -g @dracula-show-fahrenheit false
set -g @dracula-show-location false
set -g @dracula-battery-label false
set -g @dracula-transparent-powerline-bg false
set -g @dracula-show-powerline false
set -g @dracula-show-left-sep 
set -g @dracula-show-right-sep 
set -g @continuum-restore 'on'

# --- prefix: C-a ---
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# --- general ---
set -g mouse on
set -g focus-events on
setw -g mode-keys vi
set -g repeat-time 3000
set-window-option -g automatic-rename off
set-option -g allow-rename off
set -g status-position top
bind r source-file ~/.tmux.conf

# --- splits keep cwd ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- resize (repeatable: prefix then H/J/K/L) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- rename / move window in a popup (ctrl-c cancels) ---
bind , display-popup -w 40 -h 3 -T " rename window (ctrl-c to exit) " -E \
  "printf 'name: '; read -r n && tmux rename-window \"\$n\""
bind . display-popup -w 40 -h 3 -T " move window (ctrl-c to exit) " -E \
  "printf 'to: '; read -r n && tmux move-window -t \"\$n\""

# --- quieter ---
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# --- colors / status bar ---
setw -g clock-mode-colour yellow
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'
set -g status-left ''
set -g status-left-length 10
set -g status-justify left
set -g status-style 'fg=red'
set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '
setw -g window-status-bell-style 'fg=yellow bg=red bold'
set -g message-style 'fg=yellow bg=red bold'
set -g message-command-style "bg=default fg=yellow"

# --- let the terminal's background show through ---
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

# --- init tpm (keep at the very bottom) ---
run -b '~/.tmux/plugins/tpm/tpm'
